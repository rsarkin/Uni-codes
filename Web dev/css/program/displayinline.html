<html>
    <head>
        <title>Display Inline</title>
         <style>
            ul{
                list-style-type:none;
                padding: 0;
                margin: 0;
            }

            li{
                display:inline;
           }
         </style>
    </head>
   
    <body>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
    </body>
</html>
