<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>horizontal navbar</title>
</head>
<style>
    body{
        margin:0;
    }

    /*For Navigation bar container*/
     ul{
        list-style: none;
        margin:0;
        padding:0;
        background-color: burlywood;
        overflow: hidden;
        
     }

     /*Make list item Horizontal*/
     li{
        float:left;
        
     }

    /*For Style links*/
    li a{
        display:block;
        text-align:center;
        color:white;
        padding: 14px 20px;
        text-decoration: none;

    }
    /*hover effect*/
    li a{
        background-color: black;
    }
    /*Active Link*/

    .active{
        background-color: green;
    }


</style>
<body>
  <h1>Horizontal Navbar</h1>
  
  <ul>
    <li><a class="active" href="#Home"> Home</a></li>
    <li><a href="#About Us"> About Us</a></li> 
    <li><a href="#Contact"> contact</a></li> 
    <li><a href="#refrence"> Refrence</a></li>
    
</body>
</html>
