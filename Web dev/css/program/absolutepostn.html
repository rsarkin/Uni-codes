<!DOCTYPE html>
<html lang="en">
<head>
    <title>Absolute Position</title>
<style>
.container{
    position: relative;
    height: 70px;
    top: 20px;
    bottom: 70px;
    border: 2px solid black;
    background-color: lightblue;
    padding: 30px;
}

.box{
    position: absolute;
    left: 670px;
    top: 120px;
    border: 2px solid black;
    background-color: lightcoral;
    padding: 10px;
}
</style>
</head>
<body>
    <h3>Absolute Position in CSS</h3>
    <div class="container">  
    </div>
    
     <div class="box">
      Absolute position
     </div>

</body>
</html>
