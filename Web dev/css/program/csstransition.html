<html>
<head>
<style>
div{
width:100px;
height:100px;
background:red;
transition-property:width,height;
transition-duration:0.2s;
}
div:hover{
width:300px;
height:300px;
}
</style>
</head>
<body>
<h1>Study of transition property</h1>
<p>when mouse is hover to data it gives transition effect</p>
<div></div>
</body>
</html>
