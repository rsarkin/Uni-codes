<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>
<style>

    .con1{
        display: grid;
        grid-template-columns: 1fr;
        gap:10px;
        margin-bottom: 20px;  
    }

       .con2{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap:10px;
        margin-bottom: 20px;  
    }

       .con3{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap:10px;
        margin-bottom: 20px;  
    }
       .con4{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap:10px;
        margin-bottom: 20px;  
    }
   .con5{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        gap:10px;
        margin-bottom: 20px;  
    }



    .box{
        background-color: lightblue;
        padding: 20px;
        text-align: center;
    }

</style>

</head>
<body>

    <h3>coloum 1</h3>
<div class="con1 ">
    <div class="box"> 1 </div>
</div>

<h3>   coloum 2</h3>
<div class="con2">
    <div class="box"> 1 </div>
    <div class="box"> 2 </div>
</div>

<h3>    coloum 3</h3>    
<div class="con3">
    <div class="box"> 1 </div>
    <div class="box"> 2 </div>
    <div class="box"> 3 </div>
</div>

<h3>    coloum 4</h3>
<div class="con4">
    <div class="box"> 1 </div>
    <div class="box"> 2 </div>
    <div class="box"> 3 </div>
    <div class="box"> 4 </div>
</div>

<h3>    coloum 5</h3>
<div class="con5">
    <div class="box"> 1 </div>
    <div class="box"> 2 </div>
    <div class="box"> 3 </div>
    <div class="box"> 4 </div>
    <div class="box"> 5 </div>
</div>



</body>
</html>
