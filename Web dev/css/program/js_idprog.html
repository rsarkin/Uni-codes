<!DOCTYPE html> 
<html> 
<body> 
<p id="parared">This is red colour</p> 
<button onclick="changered()">Red</button> <br> <br>  
<p id="parayellow">This is yellow colour</p> 
<button onclick="changeyellow()">Yellow</button> <br> <br> 
<p id="paragreen">This is Green colour</p> 
<button onclick="changegreen()">Green</button> <br> <br> 
<script> 
function changered() { 
document.getElementById("parared").style.color = "red"; 
} 
function changeyellow() { 
document.getElementById("parayellow").style.color ="yellow"; 
} 
function changegreen() { 
document.getElementById("paragreen").style.color ="green"; 
} 
</script> 
</body> 
</html>
