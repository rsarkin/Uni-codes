<html>
<head>
<style>
div{
width:100px;
height:100px;
background:yellow;
border:2px solid black;
padding:20px 20px 20px 20px;
position:relative;
left:50px;
top:100px
transition-property:padding,border,position,left;
transition-duration:0.2s;
}
div:hover{
border:5px solid black;
padding:40px 40px 40px 40px;
position:relative;
left:100px;
}
</style>
</head>
<body>
<h1>Study of transition property</h1>
<p>when mouse is hover to data it gives transition effect</p>
<div></div>
</body>
</html>
